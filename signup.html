{% extends "base.html" %}
{% block content %}
<div class="wrap"><div class="auth">
<h1>회원가입</h1>
<form method="post">
<input type="hidden" name="_csrf" value="{{ csrf_token() }}">
<div class="field"><label>이름</label><input name="name" required autocomplete="name"></div>
<div class="field"><label>이메일</label><input type="email" name="email" required autocomplete="email"></div>
<div class="field"><label>전화번호</label><input name="phone" required autocomplete="tel"></div>
<div class="field"><label>비밀번호</label><input type="password" name="password" required minlength="8" autocomplete="new-password"></div>
<label class="check"><input type="checkbox" name="agree" required> 개인정보 처리 관련 안내를 확인하고 동의합니다.</label>
<div class="form-actions"><button class="btn primary" type="submit">회원가입</button></div>
</form>
</div></div>
{% endblock %}
